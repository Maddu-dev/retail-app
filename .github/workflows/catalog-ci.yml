name: Catalog CI

on:
  pull_request:
    paths:
      - "src/catalog/**"
      - "src/app/**"
      - "package.json"
      - "yarn.lock"
      - "nx.json"
      - "mise.toml"
      - ".github/workflows/catalog-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/catalog/**"
      - "src/app/**"
      - "package.json"
      - "yarn.lock"
      - "nx.json"
      - "mise.toml"
      - ".github/workflows/catalog-ci.yml"

permissions:
  contents: read

env:
  IMAGE_NAME: retail-catalog

jobs:
  pre-build:
    name: Pre-build security and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/catalog/go.mod
          cache: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test catalog
        run: yarn nx test catalog

      # - name: Scan source dependencies
      #   run: |
      #     docker run --rm \
      #       -v "$GITHUB_WORKSPACE:/repo:ro" \
      #       -v "${{ runner.temp }}/trivy-cache:/root/.cache/" \
      #       aquasec/trivy:latest \
      #       fs /repo \
      #       --scanners vuln \
      #       --severity HIGH,CRITICAL \
      #       --skip-dirs /repo/.git \
      #       --skip-dirs /repo/.local-evidence \
      #       --skip-dirs /repo/dist \
      #       --no-progress \
      #       --exit-code 1
      - name: Dependency vulnerability scan
        id: dependency_scan
        shell: bash
        run: |
          set +e

          mkdir -p "$RUNNER_TEMP/trivy"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/trivy:/root/.cache/" \
            aquasec/trivy:latest \
            fs /repo \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --skip-dirs /repo/.git \
            --skip-dirs /repo/.local-evidence \
            --skip-dirs /repo/dist \
            --no-progress \
            --format table \
            2>&1 | tee "$RUNNER_TEMP/trivy/dependency-scan.log"

          scan_exit="${PIPESTATUS[0]}"

          if grep -qE '429 Too Many Requests|HTTP 429|rate limit' \
              "$RUNNER_TEMP/trivy/dependency-scan.log"; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            {
              echo "### Dependency scan: PENDING"
              echo ""
              echo "Trivy could not resolve dependency metadata because Maven returned HTTP 429."
              echo "This is not a successful vulnerability scan."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$scan_exit" -eq 0 ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "### Dependency scan: PASS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "status=fail" >> "$GITHUB_OUTPUT"
          {
            echo "### Dependency scan: FAIL"
            echo ""
            echo "Vulnerabilities were found or Trivy failed for a reason other than HTTP 429."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$scan_exit"

      
      - name: Scan Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/catalog/Dockerfile
          failure-threshold: error
        
  build-and-scan:
    name: Build and scan catalog image
    needs: pre-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build catalog image
        run: |
          docker build \
            --file src/catalog/Dockerfile \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .


      - name: Scan built image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME}}:${{ github.sha }}"
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.IMAGE_NAME}}:${{ github.sha }}"
          format: cyclonedx-json
          output-file: catalog-sbom.json
          upload-artifact: true

      - name: Save image metadata
        run: |
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" \
            --format 'image_id={{.Id}}' > catalog-image.txt
          echo "source_commit=${GITHUB_SHA}" >> catalog-image.txt
          echo "image_tag=${IMAGE_NAME}:${GITHUB_SHA}" >> catalog-image.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: catalog-release-evidence
          path: |
            catalog-sbom.json
            catalog-image.txt
          retention-days: 14
           